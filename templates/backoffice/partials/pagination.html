{% if page_obj.paginator.num_pages > 1 %}
  <nav class="panel-pagination" aria-label="صفحه‌بندی">
    {% if page_obj.has_previous %}<a href="?q={{ search_query|urlencode }}&page={{ page_obj.previous_page_number }}"><i class="fa fa-angle-right"></i></a>{% endif %}
    <span>صفحهٔ {{ page_obj.number }} از {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a href="?q={{ search_query|urlencode }}&page={{ page_obj.next_page_number }}"><i class="fa fa-angle-left"></i></a>{% endif %}
  </nav>
{% endif %}
