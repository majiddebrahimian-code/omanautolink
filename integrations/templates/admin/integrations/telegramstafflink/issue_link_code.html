{% extends "admin/base_site.html" %}

{% block content %}
  <h1>{{ title }}</h1>
  <p>کد فقط یک بار نمایش داده می‌شود و نباید در پیام عمومی یا فایل مشترک ذخیره شود.</p>

  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="submit-row">
      <input type="submit" value="ایجاد کد یک‌بارمصرف" class="default">
      <a href="../" class="button cancel-link">انصراف</a>
    </div>
  </form>
{% endblock %}
